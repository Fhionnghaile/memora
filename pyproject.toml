[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memora"
version = "0.1.0"
description = "A Difficulty-Stability-Retrievability (DSR) spaced-repetition scheduler with parameter fitting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Padraig"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
sim = ["streamlit>=1.30", "matplotlib>=3.7"]
bench = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
