name: CI
on: { push: { branches: [main] }, pull_request: {}, schedule: [{ cron: "22 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[bench,dev]"
      - run: pytest -q
      - run: PYTHONPATH=src python benchmarks/run.py   # benchmark must run clean
