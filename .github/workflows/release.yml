name: Release
# On a version tag: a source archive, an SPDX software bill of materials (SBOM) for it,
# and signed attestations (build provenance + SBOM) anyone can verify with
#   gh attestation verify <archive> --repo Fhionnghaile/memora
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source archive
        run: git archive --format=tar.gz --prefix=memora-${{ github.ref_name }}/ -o memora-${{ github.ref_name }}.tar.gz HEAD
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: memora-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: memora-${{ github.ref_name }}.tar.gz
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: memora-${{ github.ref_name }}.tar.gz
          sbom-path: memora-${{ github.ref_name }}.spdx.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            memora-${{ github.ref_name }}.tar.gz
            memora-${{ github.ref_name }}.spdx.json
          generate_release_notes: true
